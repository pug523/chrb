name: Release

run-name: Auto release for ${{ github.ref_name }}

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Release (${{ matrix.plat }}-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        cc: [clang]
        cxx: [clang++]
        llvm_version: [22.1.8]
        os:
          - ubuntu-24.04
          - macos-26
          - windows-2025-vs2026
        include:
          - os: ubuntu-24.04
            plat: linux
            arch: x86_64
            stdlib: libc++
            archive: tar.gz
          - os: macos-26
            plat: macosx
            arch: arm64
            stdlib: libc++
            archive: tar.gz
          - os: windows-2025-vs2026
            plat: windows
            arch: x64
            stdlib: msvc
            archive: zip
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      COLORTERM: 256color
      XMAKE_COLORTERM: 256color
      XMAKE_ROOT: y
      basename: "chrb"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - name: Setup build environment
        uses: pug523/actions/cxx-setup@b86086d028214a9933e4bfd80f0a19a3d067716b
        with:
          os: ${{ runner.os }}
          plat: ${{ matrix.plat }}
          arch: ${{ matrix.arch }}
          build_type: ${{ matrix.build_type }}
          llvm_version: ${{ matrix.llvm_version }}

      - name: Configure
        shell: bash
        run: |
          xmake config -c -y \
            -m release \
            --toolchain=clang \
            --lto=y \
            --stdlib="${{ matrix.stdlib }}" \
            -p "${{ matrix.plat }}" \
            -a "${{ matrix.arch }}"

      - name: Build
        shell: bash
        run: |
          xmake build chrb

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.plat }}-${{ matrix.arch }}
          path: build/${{ matrix.plat }}/${{ matrix.arch }}/**

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p dist
          cp LICENSE README.md dist/ 2>/dev/null || true
          cp build/${{ matrix.plat }}/${{ matrix.arch }}/**/${{ env.basename }}* dist/
          if [[ "${{ matrix.plat }}" == "windows" ]]; then
            cd dist && 7z a ../${{ env.basename }}-${{ matrix.plat }}-${{ matrix.arch }}.${{ matrix.archive }} *
          else
            cd dist && tar -czvf ../${{ env.basename }}-${{ matrix.plat }}-${{ matrix.arch }}.${{ matrix.archive }} *
          fi

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          files: ${{ env.basename }}-${{ matrix.plat }}-${{ matrix.arch }}.${{ matrix.archive }}
          draft: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
